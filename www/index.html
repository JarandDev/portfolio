<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>JarandDev</title>
    <style>
        :root {
            --max-width: 920px;

            /* Dark mode palette (default) */
            --bg: #0b0f19;
            --card-bg: rgba(255, 255, 255, 0.04);
            --text: #e8eaf0;
            --muted: #a9b0c1;
            --border: rgba(255, 255, 255, 0.12);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);

            --link: #7ab0ff;
            --link-hover: #a9ccff;
        }

        /* Optional: follow OS setting if user explicitly prefers light */
        @media (prefers-color-scheme: light) {
            :root {
                --bg: #ffffff;
                --card-bg: #ffffff;
                --text: #1a1a1a;
                --muted: #555;
                --border: #e6e6e6;
                --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);

                --link: #0b57d0;
                --link-hover: #063c91;
            }
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            color: var(--text);
            background: radial-gradient(1200px 600px at 18% 12%, rgba(255, 159, 67, 0.16), transparent 62%),
            radial-gradient(900px 520px at 22% 40%, rgba(255, 122, 48, 0.10), transparent 60%),
            radial-gradient(900px 500px at 90% 20%, rgba(255, 122, 196, 0.10), transparent 60%),
            radial-gradient(1100px 650px at 82% 65%, rgba(168, 85, 247, 0.10), transparent 62%),
            var(--bg);
        }

        .wrapper {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 44px 16px;
            box-sizing: border-box;
        }

        .card {
            width: 100%;
            max-width: var(--max-width);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 24px;
            box-sizing: border-box;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            box-shadow: var(--shadow);
        }

        .header {
            display: flex;
            align-items: center;
            gap: 24px;
            flex-wrap: wrap;
        }

        .avatar {
            width: 160px;
            height: 160px;
            border-radius: 999px;
            object-fit: cover;
            border: 1px solid var(--border);
        }

        h1 {
            margin: 0;
            font-size: 32px;
            line-height: 1.2;
        }

        .subtitle {
            margin: 8px 0 0;
            color: var(--muted);
            font-size: 18px;
        }

        .info {
            margin-top: 22px;
            display: grid;
            grid-template-columns: 160px 1fr;
            gap: 10px 16px;
        }

        .label {
            color: var(--muted);
        }

        .value {
            font-weight: 600;
        }

        .links {
            margin-top: 22px;
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }

        a {
            color: var(--link);
            text-decoration: none;
        }

        a:hover {
            color: var(--link-hover);
            text-decoration: underline;
        }

        @media (max-width: 560px) {
            .avatar {
                width: 120px;
                height: 120px;
            }

            h1 {
                font-size: 26px;
            }

            .info {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="wrapper">
    <main class="card">
        <section class="header">
            <img alt="Profilbilde av Jarand Homleid Haugen" class="avatar" src="profile.jpg">

            <div>
                <h1>Jarand Homleid Haugen</h1>
                <p class="subtitle">Systemutvikler i Tolletaten</p>
            </div>
        </section>

        <section aria-label="Nøkkelinformasjon" class="info">
            <div class="label">Alder</div>
            <div class="value">XX år</div>

            <div class="label">Bosted</div>
            <div class="value">Oslo, Norge</div>

            <div class="label">Yrke</div>
            <div class="value">Systemutvikler</div>

            <div class="label">Arbeidsgiver</div>
            <div class="value">Tolletaten</div>
        </section>

        <section aria-label="Lenker" class="links">
            <a href="https://github.com/JarandDev" rel="noreferrer" target="_blank">GitHub-profil</a>
        </section>
    </main>
</div>

</body>
</html>
